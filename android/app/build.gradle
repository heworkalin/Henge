apply plugin: 'com.android.application'

// targetSdk is a knob on purpose, not a constant. The SELinux domain an app runs
// in is derived from targetSdkVersion through seapp_contexts, and legacy domains
// are generally more permissive about executable memory — which is exactly the
// question the probe in this app exists to answer. See plan.md §4.
//
//   ./gradlew :app:assembleDebug                 # default (36)
//   ./gradlew :app:assembleDebug -PtargetSdk=28  # legacy-domain build
//
def targetSdkOverride = (project.findProperty('targetSdk') ?: '36').toString().toInteger()

android {
    namespace 'dev.henge.probe'
    compileSdk 36

    // AGP needs this to find the NDK's llvm-strip; without it the packager warns
    // that libhenge.so could not be stripped and ships the 1.2 MB debug build.
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'dev.henge.probe'
        minSdk 26          // AAudio, memfd_create via syscall, Vulkan 1.0
        targetSdk targetSdkOverride
        versionCode 1
        versionName '0.0.1'
        ndk {
            // Only arm64: the engine is arm64-only, and the C build emits arm64-v8a.
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            // AGP's default debug keystore (~/.android/debug.keystore) is fine for
            // the probe. A release build needs signing.properties — see README.
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Two native library sources, deliberately in different places:
    //
    //   build/android-arm64-v8a/lib  libhenge.so, built outside Gradle by
    //                                android/build-c.sh. Pointed at directly
    //                                instead of copied into the source tree, so
    //                                there is one artefact and no chance of a
    //                                stale copy being packaged.
    //   src/main/jniLibs             the Vulkan driver (Turnip), fetched by
    //                                android/fetch-turnip.sh.
    sourceSets {
        main {
            jniLibs.srcDirs = [
                    "${rootDir}/../build/android-arm64-v8a/lib",
                    "src/main/jniLibs",
            ]
        }
    }

    // useLegacyPackaging = extract the libraries onto the filesystem, i.e.
    // android:extractNativeLibs="true".
    //
    // This reverses an earlier decision, and the reason is the embedded driver.
    // With extraction off, the library lives inside the APK and the only way to
    // load it is a path like base.apk!/lib/arm64-v8a/libvulkan_freedreno.so,
    // which depends on the entry being uncompressed and aligned. With extraction
    // on it is an ordinary file in nativeLibraryDir, which is the shape
    // FCLDriverPlugin is proven with on real devices and which keeps the driver
    // selection identical whether the driver came from this APK or from a plugin.
    //
    // libhenge.so is unaffected: System.loadLibrary works either way.
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Nothing yet: the probe uses android.util.Log and a TextView, no AndroidX.
}

// Fail loudly rather than packaging an APK with no native library in it.
tasks.register('checkNativeLib') {
    group = 'verification'
    description = 'Fails if libhenge.so has not been built'
    def so = file("${rootDir}/../build/android-arm64-v8a/lib/arm64-v8a/libhenge.so")
    doLast {
        if (!so.exists()) {
            throw new GradleException(
                "libhenge.so is missing at ${so}.\n" +
                "Build it first:  ./android/build-c.sh")
        }
        println "[henge] native library: ${so} (${so.length()} bytes)"
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn 'checkNativeLib'
}
