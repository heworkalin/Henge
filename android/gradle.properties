# Gradle settings for the Henge Android app.
#
# Adapted from the reference project (AlinOs app_proot, AGENTS.md "如何编译"),
# which documents what an aarch64 host needs. Two of its settings matter here and
# are explained below; the rest is boilerplate.

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.workers.max=4

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# aapt2 must be an aarch64 binary on this host.
#
# AGP fetches aapt2 from Maven, and that artifact is built for x86_64 — it
# cannot run here. The SDK ships a native one for this architecture in
# build-tools 36.1.0 and 37.0.0 (verified: those two are "ELF 64-bit ARM
# aarch64", while 30.0.3 / 34.x / 35.0.0 are x86-64), so aapt2 is pinned to it.
#
# On an x86_64 machine this line should be commented out.
# ---------------------------------------------------------------------------
android.aapt2FromMavenOverride=/home/he/Android/Sdk/build-tools/36.1.0/aapt2

# ---------------------------------------------------------------------------
# Deliberately NOT set: android.experimental.cmake.dir / cmake.dir
#
# The reference project sets cmake.dir to a local aarch64 CMake, because AGP's
# externalNativeBuild runs CMake itself. That is needed there and not here,
# because $ANDROID_HOME/cmake/3.22.1/bin/cmake on this machine is an x86-64
# binary (verified with `file`) and cannot execute.
#
# Henge's native library therefore does not go through AGP's externalNativeBuild
# at all: build-c.sh runs the system CMake with the NDK toolchain file and writes
# libhenge.so, and the app module picks that output up through jniLibs.srcDirs.
# One toolchain, one build command, and no CMake inside Gradle to keep in step.
# ---------------------------------------------------------------------------

# Uncomment to test the low-targetSdk hypothesis (see plan.md §4): the SELinux
# domain an app gets is chosen from targetSdkVersion via seapp_contexts, and the
# legacy domains are generally more permissive about executable memory. Passed
# through to app/build.gradle as -PtargetSdk=28.
#targetSdk=28
