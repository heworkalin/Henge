[package]
name = "metal2vulkan-runtime"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
authors = ["Anees Iqbal <hello@aneesiqbal.ai>"]
description = "The Metal API on Vulkan: Metal's objects and calls run on a Vulkan device through ash"
repository = "https://github.com/steelbrain/metal2vulkan"
homepage = "https://github.com/steelbrain/metal2vulkan"
autobins = false
autoexamples = false
autotests = false

[lib]
name = "metal2vulkan_runtime"
path = "src/lib.rs"

[dependencies]
metal2vulkan = { git = "https://github.com/steelbrain/metal2vulkan", rev = "219f01365dc4c8eb346816c405b5b17403793764", features = ["ash"] }
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
libc = "0.2"
sha2 = { version = "0.11", default-features = false }
